
name: User Service CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read
  pull-requests: read

jobs:
  # 1. Detect changes related to User Service
  changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    outputs:
      user-service: ${{ steps.filter.outputs.user-service }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Filter changed files
        uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            user-service:
              - 'user-service/**'
              - 'pom.xml'
              - '.github/workflows/user-service-ci.yml'

  # 2. Build, Test, Scan and Push
  build-test-scan-push:
    name: Build, Test, Scan and Push
    needs: changes
    if: needs.changes.outputs.user-service == 'true'
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout source code
      - name: Checkout repository
        uses: actions/checkout@v6

      # 2. Setup Java 25 and Maven cache
      - name: Set up JDK 25
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
          cache-dependency-path: '**/pom.xml'

      # 3. Run Maven tests
      - name: Run Maven tests
        run: mvn -B -ntp -pl user-service -am clean verify

      # 4. Setup Docker Buildx
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      # 5. Build Docker image locally
      - name: Build Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: user-service/Dockerfile
          load: true
          push: false
          tags: user-service:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # 6. Scan Docker image with Trivy
      - name: Scan image with Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: user-service:ci
          format: table
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: os,library
          severity: HIGH,CRITICAL

      # 7. Login to Docker Hub (only on main push)
      - name: Login to Docker Hub
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v4
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # 8. Push image to Docker Hub
      - name: Push image to Docker Hub
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          docker tag user-service:ci ${{ vars.DOCKERHUB_USERNAME }}/user-service:${{ github.sha }}
          docker push ${{ vars.DOCKERHUB_USERNAME }}/user-service:${{ github.sha }}

          docker tag user-service:ci ${{ vars.DOCKERHUB_USERNAME }}/user-service:latest
          docker push ${{ vars.DOCKERHUB_USERNAME }}/user-service:latest

  # 3. Stable required check for GitHub Ruleset
  ci:
    name: CI
    needs:
      - changes
      - build-test-scan-push
    if: always()
    runs-on: ubuntu-latest

    steps:
      - name: Verify CI result
        run: |
          if [[ "${{ needs.changes.result }}" != "success" ]]; then
            echo "Change detection failed."
            exit 1
          fi

          if [[ "${{ needs.build-test-scan-push.result }}" != "success" && \
                "${{ needs.build-test-scan-push.result }}" != "skipped" ]]; then
            echo "User Service CI failed."
            exit 1
          fi

          echo "CI passed."
